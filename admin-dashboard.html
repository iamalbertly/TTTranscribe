<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTTranscribe Admin Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .header h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .header .subtitle {
      color: #666;
      font-size: 14px;
    }

    .config-section {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .config-section h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .config-form {
      display: grid;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      color: #555;
      font-size: 14px;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .form-group input {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #5568d3;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .stat-card .label {
      color: #666;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .stat-card .value {
      color: #333;
      font-size: 32px;
      font-weight: bold;
    }

    .stat-card.healthy .value {
      color: #10b981;
    }

    .stat-card.warning .value {
      color: #f59e0b;
    }

    .stat-card.critical .value {
      color: #ef4444;
    }

    .queue-section {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .queue-section h2 {
      color: #333;
      margin-bottom: 15px;
    }

    .queue-empty {
      text-align: center;
      padding: 40px;
      color: #10b981;
      font-size: 18px;
    }

    .queue-table {
      width: 100%;
      border-collapse: collapse;
    }

    .queue-table th {
      background: #f3f4f6;
      padding: 12px;
      text-align: left;
      font-size: 14px;
      color: #555;
      font-weight: 600;
    }

    .queue-table td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
      color: #333;
    }

    .queue-table tr:last-child td {
      border-bottom: none;
    }

    .retry-btn {
      padding: 6px 12px;
      font-size: 12px;
      background: #3b82f6;
    }

    .retry-btn:hover {
      background: #2563eb;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-badge.healthy {
      background: #d1fae5;
      color: #065f46;
    }

    .status-badge.unhealthy {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    .auto-refresh {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
    }

    .auto-refresh input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .auto-refresh label {
      cursor: pointer;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎯 TTTranscribe Admin Dashboard</h1>
      <p class="subtitle">Monitor webhook queue and system health</p>
    </div>

    <div class="config-section">
      <h2>⚙️ Configuration</h2>
      <div class="config-form">
        <div class="form-group">
          <label for="baseUrl">Base URL</label>
          <input type="text" id="baseUrl" placeholder="https://iamromeoly-tttranscribe.hf.space" value="https://iamromeoly-tttranscribe.hf.space">
        </div>
        <div class="form-group">
          <label for="adminKey">Admin Key (ENGINE_ADMIN_KEY)</label>
          <input type="password" id="adminKey" placeholder="Enter admin key">
        </div>
        <button onclick="loadDashboard()">🔄 Load Dashboard</button>
        <div class="auto-refresh">
          <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()">
          <label for="autoRefresh">Auto-refresh every 30 seconds</label>
        </div>
      </div>
    </div>

    <div id="error" class="error" style="display: none;"></div>

    <div id="stats" style="display: none;">
      <div class="stats-grid">
        <div class="stat-card" id="healthCard">
          <div class="label">Service Status</div>
          <div class="value" id="healthStatus">-</div>
        </div>
        <div class="stat-card" id="uptimeCard">
          <div class="label">Uptime</div>
          <div class="value" id="uptimeValue">-</div>
        </div>
        <div class="stat-card" id="queueCard">
          <div class="label">Webhook Queue</div>
          <div class="value" id="queueSize">-</div>
        </div>
        <div class="stat-card">
          <div class="label">Cache Size</div>
          <div class="value" id="cacheSize">-</div>
        </div>
      </div>
    </div>

    <div class="queue-section">
      <h2>📋 Webhook Queue</h2>
      <div id="loading" class="loading">Click "Load Dashboard" to view webhook queue</div>
      <div id="queueEmpty" class="queue-empty" style="display: none;">
        ✅ No failed webhooks in queue
      </div>
      <div id="queueContent" style="display: none;"></div>
    </div>
  </div>

  <script>
    let autoRefreshInterval = null;

    function getConfig() {
      return {
        baseUrl: document.getElementById('baseUrl').value.trim(),
        adminKey: document.getElementById('adminKey').value.trim(),
      };
    }

    function showError(message) {
      const errorEl = document.getElementById('error');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error').style.display = 'none';
    }

    async function loadHealth() {
      const { baseUrl, adminKey } = getConfig();

      try {
        const response = await fetch(`${baseUrl}/health`);
        const data = await response.json();

        // Update stats
        const healthCard = document.getElementById('healthCard');
        const healthStatus = document.getElementById('healthStatus');

        if (data.status === 'healthy') {
          healthCard.className = 'stat-card healthy';
          healthStatus.textContent = '✅ Healthy';
        } else {
          healthCard.className = 'stat-card critical';
          healthStatus.textContent = '❌ Unhealthy';
        }

        // Uptime
        const uptimeMinutes = Math.floor(data.uptime / 60);
        const uptimeHours = Math.floor(uptimeMinutes / 60);
        const uptimeDays = Math.floor(uptimeHours / 24);
        let uptimeText = uptimeDays > 0 ? `${uptimeDays}d` : uptimeHours > 0 ? `${uptimeHours}h` : `${uptimeMinutes}m`;
        document.getElementById('uptimeValue').textContent = uptimeText;

        // Cache
        document.getElementById('cacheSize').textContent = data.cache?.size || 0;

        // Webhook queue
        const queueSize = data.webhook?.queueSize || 0;
        document.getElementById('queueSize').textContent = queueSize;

        const queueCard = document.getElementById('queueCard');
        if (queueSize === 0) {
          queueCard.className = 'stat-card healthy';
        } else if (queueSize < 10) {
          queueCard.className = 'stat-card warning';
        } else {
          queueCard.className = 'stat-card critical';
        }

        document.getElementById('stats').style.display = 'block';

      } catch (error) {
        console.error('Failed to load health:', error);
      }
    }

    async function loadWebhookQueue() {
      const { baseUrl, adminKey } = getConfig();

      if (!adminKey) {
        showError('❌ Admin key is required');
        return;
      }

      hideError();
      document.getElementById('loading').style.display = 'block';
      document.getElementById('queueEmpty').style.display = 'none';
      document.getElementById('queueContent').style.display = 'none';

      try {
        const response = await fetch(`${baseUrl}/admin/webhook-queue`, {
          headers: {
            'X-Engine-Auth': adminKey,
          },
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        const queue = data.queue || [];

        document.getElementById('loading').style.display = 'none';

        if (queue.length === 0) {
          document.getElementById('queueEmpty').style.display = 'block';
        } else {
          renderQueue(queue);
          document.getElementById('queueContent').style.display = 'block';
        }

      } catch (error) {
        document.getElementById('loading').style.display = 'none';
        showError(`Failed to load webhook queue: ${error.message}`);
      }
    }

    function renderQueue(queue) {
      const html = `
        <table class="queue-table">
          <thead>
            <tr>
              <th>Job ID</th>
              <th>Failed Count</th>
              <th>Last Failed At</th>
              <th>Error</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${queue.map(item => `
              <tr>
                <td><code>${item.jobId}</code></td>
                <td>${item.failedCount}</td>
                <td>${new Date(item.lastFailedAt).toLocaleString()}</td>
                <td>${item.error}</td>
                <td>
                  <button class="retry-btn" onclick="retryWebhook('${item.jobId}')">
                    🔄 Retry
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      document.getElementById('queueContent').innerHTML = html;
    }

    async function retryWebhook(jobId) {
      const { baseUrl, adminKey } = getConfig();

      if (confirm(`Retry webhook for job ${jobId}?`)) {
        try {
          const response = await fetch(`${baseUrl}/admin/retry-webhook/${jobId}`, {
            method: 'POST',
            headers: {
              'X-Engine-Auth': adminKey,
            },
          });

          if (response.ok) {
            alert('✅ Webhook retry successful!');
            loadDashboard();
          } else {
            const data = await response.json();
            alert(`❌ Retry failed: ${data.error || data.message}`);
          }
        } catch (error) {
          alert(`❌ Retry failed: ${error.message}`);
        }
      }
    }

    async function loadDashboard() {
      await Promise.all([
        loadHealth(),
        loadWebhookQueue(),
      ]);
    }

    function toggleAutoRefresh() {
      const enabled = document.getElementById('autoRefresh').checked;

      if (enabled) {
        loadDashboard();
        autoRefreshInterval = setInterval(loadDashboard, 30000);
      } else {
        if (autoRefreshInterval) {
          clearInterval(autoRefreshInterval);
          autoRefreshInterval = null;
        }
      }
    }

    // Load from localStorage if available
    window.addEventListener('DOMContentLoaded', () => {
      const savedBaseUrl = localStorage.getItem('ttt_base_url');
      const savedAdminKey = localStorage.getItem('ttt_admin_key');

      if (savedBaseUrl) {
        document.getElementById('baseUrl').value = savedBaseUrl;
      }
      if (savedAdminKey) {
        document.getElementById('adminKey').value = savedAdminKey;
      }

      // Save to localStorage on change
      document.getElementById('baseUrl').addEventListener('change', (e) => {
        localStorage.setItem('ttt_base_url', e.target.value);
      });
      document.getElementById('adminKey').addEventListener('change', (e) => {
        localStorage.setItem('ttt_admin_key', e.target.value);
      });
    });
  </script>
</body>
</html>
